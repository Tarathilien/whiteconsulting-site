<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Backend POST test</title>
<style>
body{font:15px/1.5 system-ui,sans-serif;background:#0B1426;color:#eee;max-width:760px;margin:32px auto;padding:0 16px}
button{background:#D4A84B;border:0;padding:10px 16px;border-radius:6px;font-weight:600;margin:4px 6px 4px 0;cursor:pointer}
pre{background:#111c33;padding:12px;border-radius:6px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<h1>Backend POST test</h1>
<p>Sends test submissions from this origin. Test addresses only.</p>
<button id="plan">Tech check: build plan (no email, no sheet row)</button>
<button id="email">Tech check: email plan (+test2)</button>
<button id="quiz">Quiz: full submit (+test3)</button>
<pre id="out">Ready.</pre>
<script>
var QUIZ="https://script.google.com/macros/s/AKfycbxodVJniJyPA3FdbvwVbN_rg6ROFeX9YhcNDCxNRkwogw_J7_M9CK3VmIgfMjbseqM6/exec";
var PLAN="https://script.google.com/macros/s/AKfycbxNfdW7RQs2vMLk15JgjQvBICRjdt6DZB6HC8109dbT2JqrcdbOFCsuDmu68IiftiqQ/exec";
var out=document.getElementById("out");
var vid=String(Date.now())+"."+Math.floor(Math.random()*1e6);
var token="";
function log(s){out.textContent+="\n"+s;}
function post(label,url,data){
  log("-> "+label);
  return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)})
    .then(function(r){return r.text().then(function(t){log("<- "+label+" status "+r.status+": "+t.slice(0,600));try{return JSON.parse(t);}catch(e){return null;}});})
    .catch(function(e){log("<- "+label+" FAILED: "+e);});
}
document.getElementById("plan").onclick=function(){
  post("plan",PLAN,{action:"plan",hp:"",vid:vid,org:"Nonprofit",platform:"Google Workspace",size:"6 to 20",note:"Test note",gaps:[0,2]}).then(function(j){if(j&&j.token){token=j.token;log("token saved");}});
};
document.getElementById("email").onclick=function(){
  if(!token){log("Run the plan test first.");return;}
  post("email",PLAN,{action:"email",hp:"",vid:vid,token:token,email:"jaredwhite2005+test2@gmail.com",name:"Jared WhiteTest",orgName:"Test Org",phone:""});
};
document.getElementById("quiz").onclick=function(){
  var a={};for(var i=1;i<=12;i++)a["q"+i]="partly";
  post("quiz",QUIZ,{website:"",consent:true,orgName:"Test Org",contactName:"Jared WhiteTest",email:"jaredwhite2005+test3@gmail.com",orgType:"nonprofit",staffCount:"1-9",gate:"no",answers:a,dataTypes:["children"],funding:["donations"],tools:""});
};
</script>
</body>
</html>
